# Manual, unsigned macOS build for forks without Apple secrets. Mirrors the
# macos-aarch64 row of release.yml: same toolchain pins, same scripts/package.
# No secrets are read, so scripts/mac-sign signs ad hoc. Nothing is published
# or tagged. scripts/mac-dmg needs a Developer ID signature and notarization,
# so no DMG is made; the artifact is the zipped Herdr.app.
name: fork mac build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-mac-build-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.95.0
  # In the cache key: ghostty-sys can't tell when Zig changes.
  ZIG_VERSION: 0.16.0

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &cache-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: fork-mac-v1-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: fork-mac-v1-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-
      - name: Keep unchanged sources fresh
        run: scripts/ci-sources restore
      # No APPLE_* variables: scripts/mac-sign then signs ad hoc.
      # scripts/package marks the build as a release, which would let the app
      # download the upstream app and replace this fork on quit. The switch
      # turns off app self-update only (core updates stay on).
      - name: Build and pack
        env:
          HERDR_APP_NO_SELF_UPDATE: "1"
        run: scripts/package
      - name: Verify release notices
        run: |
          archive=dist/herdr-app-macos-aarch64.tar.gz
          prefix=Herdr.app/Contents/Resources
          tar -xOf "$archive" "$prefix/THIRD-PARTY-NOTICES" | cmp - THIRD-PARTY-NOTICES
          tar -xOf "$archive" "$prefix/LICENSE" | cmp - LICENSE
      - name: Zip the app
        run: |
          tar -xzf dist/herdr-app-macos-aarch64.tar.gz -C dist
          codesign --verify --deep --strict dist/Herdr.app
          ditto -c -k --keepParent dist/Herdr.app dist/Herdr-macos-aarch64.zip
      - name: Note the sources the cache was built from
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/ci-sources record
      - name: Save build cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *cache-paths
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdr-app-macos-aarch64-unsigned
          path: dist/Herdr-macos-aarch64.zip
          if-no-files-found: error
          retention-days: 7
